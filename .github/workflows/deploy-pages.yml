name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test -- --watch=false

      - name: Build de produção
        run: npm run build:pages

      - name: Fallback para rotas da SPA
        run: cp dist/batalha-naval-2026/browser/index.html dist/batalha-naval-2026/browser/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/batalha-naval-2026/browser

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
